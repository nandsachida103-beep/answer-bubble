name: Build Answer Bubble APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project files
        run: |
          set -e
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AnswerBubble"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.tutor.answerbubble"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.tutor.answerbubble"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Answer Bubble"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Answer Bubble"
                  android:textSize="26sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="Anthropic API key" />

              <EditText
                  android:id="@+id/apiKey"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="sk-ant-..."
                  android:inputType="textPassword"
                  android:singleLine="true" />

              <Button
                  android:id="@+id/startBtn"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="Start floating bubble" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:lineSpacingExtra="4dp"
                  android:text="How to use:\n1. Tap Start and allow the permissions.\n2. Open any practice app.\n3. Tap Ans for only the answer, or Why for answer + explanation.\n4. Drag the bubble with the ✥ handle. Tap ✕ to stop." />
          </LinearLayout>
          EOF_FILE
          mkdir -p app/src/main/java/com/tutor/answerbubble
          cat > app/src/main/java/com/tutor/answerbubble/MainActivity.kt <<'EOF_FILE'
          package com.tutor.answerbubble

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast

          class MainActivity : Activity() {

              private val reqProjection = 1
              private val reqOverlay = 2
              private val reqNotif = 3
              private lateinit var keyField: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  keyField = findViewById(R.id.apiKey)
                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  keyField.setText(prefs.getString("key", ""))
                  findViewById<Button>(R.id.startBtn).setOnClickListener { startFlow() }
              }

              private fun startFlow() {
                  val key = keyField.text.toString().trim()
                  if (key.isEmpty()) {
                      Toast.makeText(this, "Enter your API key first", Toast.LENGTH_SHORT).show()
                      return
                  }
                  getSharedPreferences("cfg", MODE_PRIVATE).edit().putString("key", key).apply()

                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Allow 'Display over other apps', then tap Start again", Toast.LENGTH_LONG).show()
                      startActivityForResult(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")),
                          reqOverlay
                      )
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), reqNotif)
                      return
                  }
                  requestProjection()
              }

              private fun requestProjection() {
                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), reqProjection)
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, results: IntArray) {
                  super.onRequestPermissionsResult(code, perms, results)
                  if (code == reqNotif) requestProjection()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqProjection) {
                      if (resultCode == RESULT_OK && data != null) {
                          val svc = Intent(this, FloatingService::class.java)
                              .putExtra("code", resultCode)
                              .putExtra("data", data)
                          startForegroundService(svc)
                          moveTaskToBack(true)
                      } else {
                          Toast.makeText(this, "Screen capture permission is required", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/tutor/answerbubble
          cat > app/src/main/java/com/tutor/answerbubble/FloatingService.kt <<'EOF_FILE'
          package com.tutor.answerbubble

          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.util.Base64
          import android.util.DisplayMetrics
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.ByteArrayOutputStream

          class FloatingService : Service() {

              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())

              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var vDisplay: VirtualDisplay? = null
              private var latest: Image? = null

              private var bubble: LinearLayout? = null
              private var panel: View? = null
              private var busy = false
              private var screenW = 0
              private var screenH = 0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
              }

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (projection != null) return START_NOT_STICKY
                  startAsForeground()

                  val code = intent?.getIntExtra("code", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  val data = intent?.getParcelableExtra<Intent>("data")
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(code, data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          handler.post { stopSelf() }
                      }
                  }, handler)

                  readScreenSize()
                  setupCapture()
                  showBubble()
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("ab", "Answer Bubble", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "ab")
                      .setContentTitle("Answer Bubble is running")
                      .setContentText("Tap ✕ on the bubble to stop")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              @Suppress("DEPRECATION")
              private fun readScreenSize() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      val b = wm.currentWindowMetrics.bounds
                      screenW = b.width(); screenH = b.height()
                  } else {
                      val dm = DisplayMetrics()
                      wm.defaultDisplay.getRealMetrics(dm)
                      screenW = dm.widthPixels; screenH = dm.heightPixels
                  }
              }

              // The virtual display is created ONCE (Android 14+ allows only one per permission grant).
              // We keep the newest frame so a tap can use it instantly.
              private fun setupCapture() {
                  val dpi = resources.displayMetrics.densityDpi
                  val r = ImageReader.newInstance(screenW, screenH, PixelFormat.RGBA_8888, 3)
                  r.setOnImageAvailableListener({ rd ->
                      val img = try { rd.acquireLatestImage() } catch (e: Exception) { null }
                      if (img != null) {
                          latest?.close()
                          latest = img
                      }
                  }, handler)
                  reader = r
                  vDisplay = projection?.createVirtualDisplay(
                      "AnswerBubble", screenW, screenH, dpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler
                  )
              }

              private fun latestBitmap(): Bitmap? {
                  val img = latest ?: return null
                  return try {
                      val plane = img.planes[0]
                      val pixelStride = plane.pixelStride
                      val rowPadding = plane.rowStride - pixelStride * img.width
                      val full = Bitmap.createBitmap(
                          img.width + rowPadding / pixelStride, img.height, Bitmap.Config.ARGB_8888
                      )
                      plane.buffer.rewind()
                      full.copyPixelsFromBuffer(plane.buffer)
                      Bitmap.createBitmap(full, 0, 0, img.width, img.height)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun dp(v: Int) = TypedValue.applyDimension(
                  TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics
              ).toInt()

              private fun chip(label: String, bgColor: Int): TextView = TextView(this).apply {
                  text = label
                  setTextColor(Color.WHITE)
                  textSize = 12f
                  typeface = Typeface.DEFAULT_BOLD
                  gravity = Gravity.CENTER
                  background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(bgColor) }
                  layoutParams = LinearLayout.LayoutParams(dp(46), dp(46)).apply {
                      setMargins(dp(3), dp(3), dp(3), dp(3))
                  }
              }

              private fun overlayParams(w: Int, h: Int) = WindowManager.LayoutParams(
                  w, h,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                  PixelFormat.TRANSLUCENT
              )

              private fun showBubble() {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(4), dp(4), dp(4), dp(4))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#CC000000"))
                          cornerRadius = dp(30).toFloat()
                      }
                  }
                  val handle = chip("✥", Color.parseColor("#616161"))
                  val ans = chip("Ans", Color.parseColor("#2E7D32"))
                  val why = chip("Why", Color.parseColor("#1565C0"))
                  val close = chip("✕", Color.parseColor("#C62828"))
                  box.addView(handle); box.addView(ans); box.addView(why); box.addView(close)

                  val p = overlayParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = dp(8); p.y = dp(200)

                  handle.setOnTouchListener(object : View.OnTouchListener {
                      var sx = 0; var sy = 0; var tx = 0f; var ty = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> { sx = p.x; sy = p.y; tx = e.rawX; ty = e.rawY }
                              MotionEvent.ACTION_MOVE -> {
                                  p.x = sx + (e.rawX - tx).toInt()
                                  p.y = sy + (e.rawY - ty).toInt()
                                  wm.updateViewLayout(box, p)
                              }
                          }
                          return true
                      }
                  })
                  ans.setOnClickListener { ask("answer") }
                  why.setOnClickListener { ask("explain") }
                  close.setOnClickListener { stopSelf() }

                  wm.addView(box, p)
                  bubble = box
              }

              private fun ask(mode: String) {
                  if (busy) return
                  val key = getSharedPreferences("cfg", MODE_PRIVATE).getString("key", "") ?: ""
                  if (key.isBlank()) {
                      Toast.makeText(this, "No API key saved", Toast.LENGTH_SHORT).show()
                      return
                  }
                  busy = true
                  hidePanel()
                  bubble?.visibility = View.INVISIBLE   // so the bubble isn't in the screenshot

                  handler.postDelayed({
                      val bmp = latestBitmap()
                      bubble?.visibility = View.VISIBLE
                      if (bmp == null) {
                          busy = false
                          showPanel("Error", "Couldn't capture the screen. Try again.")
                          return@postDelayed
                      }
                      showPanel("Thinking…", "Reading the question…")
                      Thread {
                          val b64 = encode(bmp)
                          val result = ClaudeClient.ask(key, b64, mode)
                          handler.post {
                              busy = false
                              showPanel(
                                  if (mode == "answer") "Answer" else "Answer + explanation",
                                  result.getOrElse { "Error: ${it.message}" }
                              )
                          }
                      }.start()
                  }, 400)
              }

              private fun encode(bmp: Bitmap): String {
                  val scale = minOf(1f, 1600f / maxOf(bmp.width, bmp.height))
                  val s = if (scale < 1f)
                      Bitmap.createScaledBitmap(bmp, (bmp.width * scale).toInt(), (bmp.height * scale).toInt(), true)
                  else bmp
                  val out = ByteArrayOutputStream()
                  s.compress(Bitmap.CompressFormat.JPEG, 85, out)
                  return Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
              }

              private fun showPanel(title: String, body: String) {
                  hidePanel()
                  val maxH = (screenH * 0.45).toInt()

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(10), dp(14), dp(14))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F2121212"))
                          cornerRadius = dp(16).toFloat()
                      }
                  }
                  val header = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val t = TextView(this).apply {
                      text = title
                      setTextColor(Color.parseColor("#80CBC4"))
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val x = TextView(this).apply {
                      text = "✕"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setPadding(dp(12), 0, 0, 0)
                      setOnClickListener { hidePanel() }
                  }
                  header.addView(t); header.addView(x)

                  val scroll = object : ScrollView(this) {
                      override fun onMeasure(w: Int, h: Int) {
                          super.onMeasure(w, MeasureSpec.makeMeasureSpec(maxH, MeasureSpec.AT_MOST))
                      }
                  }
                  val tv = TextView(this).apply {
                      text = body
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      setPadding(0, dp(8), 0, 0)
                  }
                  scroll.addView(tv)
                  box.addView(header); box.addView(scroll)

                  val p = overlayParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  p.gravity = Gravity.BOTTOM
                  p.horizontalMargin = 0.03f
                  p.y = dp(24)
                  wm.addView(box, p)
                  panel = box
              }

              private fun hidePanel() {
                  panel?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  panel = null
              }

              override fun onDestroy() {
                  hidePanel()
                  bubble?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  bubble = null
                  latest?.close(); latest = null
                  vDisplay?.release()
                  reader?.close()
                  val p = projection
                  projection = null
                  try { p?.stop() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/tutor/answerbubble
          cat > app/src/main/java/com/tutor/answerbubble/ClaudeClient.kt <<'EOF_FILE'
          package com.tutor.answerbubble

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object ClaudeClient {

              // Change this if you want a different model (e.g. "claude-haiku-5-5" is cheaper/faster).
              private const val MODEL = "claude-sonnet-5-5"

              private const val ANSWER_ONLY =
                  "This screenshot shows a practice question (probably multiple choice). " +
                  "Reply with ONLY the final answer: the correct option letter/number, plus the option text if it is short. " +
                  "If there are several questions, list them as '1. B', '2. D' and so on. " +
                  "No explanation. Plain text only, no markdown. If you cannot find a question, say 'No question found'."

              private const val WITH_EXPLANATION =
                  "This screenshot shows a practice question (probably multiple choice). " +
                  "First line: the correct answer (option letter/number and text). " +
                  "Then a clear, short, step-by-step explanation a school student can follow. " +
                  "Plain text only, no markdown symbols. If you cannot find a question, say 'No question found'."

              fun ask(apiKey: String, jpegBase64: String, mode: String): Result<String> = runCatching {
                  val prompt = if (mode == "answer") ANSWER_ONLY else WITH_EXPLANATION

                  val image = JSONObject()
                      .put("type", "image")
                      .put(
                          "source", JSONObject()
                              .put("type", "base64")
                              .put("media_type", "image/jpeg")
                              .put("data", jpegBase64)
                      )
                  val text = JSONObject().put("type", "text").put("text", prompt)
                  val body = JSONObject()
                      .put("model", MODEL)
                      .put("max_tokens", 1500)
                      .put(
                          "messages", JSONArray().put(
                              JSONObject().put("role", "user")
                                  .put("content", JSONArray().put(image).put(text))
                          )
                      )

                  val conn = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.connectTimeout = 20000
                  conn.readTimeout = 60000
                  conn.doOutput = true
                  conn.setRequestProperty("content-type", "application/json")
                  conn.setRequestProperty("x-api-key", apiKey)
                  conn.setRequestProperty("anthropic-version", "2023-06-01")
                  conn.outputStream.use { it.write(body.toString().toByteArray()) }

                  val code = conn.responseCode
                  val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                  val resp = stream.bufferedReader().use { it.readText() }

                  if (code !in 200..299) {
                      val msg = try {
                          JSONObject(resp).getJSONObject("error").getString("message")
                      } catch (e: Exception) {
                          resp.take(200)
                      }
                      throw Exception("($code) $msg")
                  }

                  val content = JSONObject(resp).getJSONArray("content")
                  buildString {
                      for (i in 0 until content.length()) {
                          val c = content.getJSONObject(i)
                          if (c.getString("type") == "text") append(c.getString("text"))
                      }
                  }.trim()
              }
          }
          EOF_FILE

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Answer Bubble APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
